name: release

# A pushed v* tag is checked, built, tested and published to Docker Hub, then a
# draft GitHub release with the image digest is created. A manual run is a dry
# run: it checks, builds and tests the selected branch for the given tag, but
# never logs in to a registry or pushes anything.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to check, for example v1.0.0 (dry run: nothing is pushed)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/vaultigen/vaultigen
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  # Runs project code, so it never sees registry credentials.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VAULTIGEN_CONTAINER_TESTS: '1'
      VAULTIGEN_COMPOSE_TESTS: '1'
      VAULTIGEN_TEST_IMAGE: vaultigen:local
    outputs:
      version: ${{ steps.build-info.outputs.version }}
      release-date: ${{ steps.build-info.outputs.release-date }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: sodium
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate --no-interaction

      # Licenses are checked against the release date, so a tag must carry a matching version and date.
      - name: Verify version and release date
        run: php artisan vaultigen:release:check "$RELEASE_TAG"

      # With RELEASE_TAG set, the Dockerfile runs the release check again inside the build.
      - name: Build image
        run: >-
          sh scripts/docker/build.sh --platform linux/amd64
          --build-arg "RELEASE_TAG=$RELEASE_TAG"
          --build-arg "SOURCE_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

      - name: Read build metadata
        id: build-info
        run: |
          build=$(docker run --rm --entrypoint cat vaultigen:local /app/build.json)
          version=$(printf '%s' "$build" | jq -er .version)
          release_date=$(printf '%s' "$build" | jq -er .release_date)
          if [ "$version" != "${RELEASE_TAG#v}" ]; then
            echo "::error::The image reports version $version, expected ${RELEASE_TAG#v}."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release-date=$release_date" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/release"

      - name: Test image
        run: vendor/bin/pest tests/Feature/ContainerImageTest.php tests/Feature/ComposeStackTest.php

      - name: Generate a software bill of materials
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: vaultigen:local
          format: spdx-json
          upload-artifact: false
          output-file: ${{ runner.temp }}/release/vaultigen-${{ steps.build-info.outputs.version }}.spdx.json

      # The publish job pushes exactly this tested image instead of rebuilding it.
      - name: Export image
        run: docker save --output "$RUNNER_TEMP/release/image.tar" vaultigen:local

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          retention-days: 1
          if-no-files-found: error

  # Runs no project code: it only loads the tested image and pushes it.
  publish:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: docker-hub
    env:
      VERSION: ${{ needs.image.outputs.version }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      # A pushed release tag is never replaced, not even by a re-run.
      - name: Refuse to overwrite a published tag
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/namespaces/vaultigen/repositories/vaultigen/tags/$VERSION")
          if [ "$status" = 200 ]; then
            echo "::error::$IMAGE:$VERSION already exists on Docker Hub. Release a new patch version instead."
            exit 1
          fi
          if [ "$status" != 404 ]; then
            echo "::error::Could not check Docker Hub for $IMAGE:$VERSION (HTTP $status)."
            exit 1
          fi

      - name: Load image
        run: |
          docker load --input "$RUNNER_TEMP/release/image.tar"
          docker tag vaultigen:local "$IMAGE:$VERSION"

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only the exact version tag is pushed; there is no latest tag.
      - name: Push image
        id: push
        run: |
          docker push "$IMAGE:$VERSION"
          digest=$(docker image inspect "$IMAGE:$VERSION" --format '{{index .RepoDigests 0}}')
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

  release:
    if: github.event_name == 'push'
    needs: [image, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.image.outputs.version }}
      RELEASE_DATE: ${{ needs.image.outputs.release-date }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}

      - name: Attest software bill of materials
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: ${{ runner.temp }}/release/vaultigen-${{ env.VERSION }}.spdx.json

      # A draft, so the highlights and upgrade notes can be added before publishing.
      - name: Create draft GitHub release
        run: |
          {
            echo "Release date: $RELEASE_DATE"
            echo
            echo "Docker image: \`$IMAGE:$VERSION\`"
            echo
            echo "Image digest: \`$DIGEST\`"
            echo
            echo "<!-- Add the highlights and upgrade notes, then publish this draft. -->"
          } > "$RUNNER_TEMP/notes.md"
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag $prerelease \
            --title "Vaultigen $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/release/vaultigen-$VERSION.spdx.json"

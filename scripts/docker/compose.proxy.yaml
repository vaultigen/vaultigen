# Optional override for a server that already runs a reverse proxy. Select it
# once in .env with COMPOSE_FILE=compose.yaml:compose.proxy.yaml. Requires
# Docker Compose 2.24.4 or later for !override.
#
# Vaultigen then serves plain HTTP on 127.0.0.1:8080 only; the proxy terminates
# HTTPS and forwards X-Forwarded-For/-Proto. With Docker, a host proxy reaches
# the container through this network's gateway, which is trusted by default.
# Rootless Podman forwards the port from the web container's own fixed address
# instead; set VAULTIGEN_TRUSTED_PROXIES=172.31.250.10 there. Set it also for a
# proxy in another container or on another host.
services:
  web:
    ports: !override
      - "127.0.0.1:${VAULTIGEN_HTTP_PORT:-8080}:8080"
    networks:
      default:
        ipv4_address: ${VAULTIGEN_WEB_ADDRESS:-172.31.250.10}
    environment:
      VAULTIGEN_WEB_MODE: http
      VAULTIGEN_TRUSTED_PROXIES: ${VAULTIGEN_TRUSTED_PROXIES:-${VAULTIGEN_NETWORK_GATEWAY:-172.31.250.1}}

networks:
  default:
    ipam:
      config:
        - subnet: ${VAULTIGEN_NETWORK_SUBNET:-172.31.250.0/24}
          gateway: ${VAULTIGEN_NETWORK_GATEWAY:-172.31.250.1}
          # Dynamic addresses stay outside the web container's fixed address.
          ip_range: ${VAULTIGEN_NETWORK_RANGE:-172.31.250.128/25}

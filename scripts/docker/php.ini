expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 512M
upload_max_filesize = 128M
post_max_size = 130M
max_execution_time = 120
upload_tmp_dir = /app/storage/app/private/tmp
sys_temp_dir = /app/storage/app/private/tmp
session.save_path = /app/storage/framework/sessions
opcache.enable = 1
opcache.validate_timestamps = 0
zend.exception_ignore_args = On
